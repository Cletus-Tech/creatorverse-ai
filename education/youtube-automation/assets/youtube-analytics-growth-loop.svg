<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="t d"><title id="t">YouTube channel improvement loop</title><desc id="d">A six-step circular process: publish, observe, diagnose, form a hypothesis, test one improvement, and record learning.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08152e"/><stop offset="1" stop-color="#142b52"/></linearGradient><linearGradient id="card" x2="1" y2="1"><stop stop-color="#173f70"/><stop offset="1" stop-color="#102444"/></linearGradient><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#6ed8ff"/></marker></defs><rect width="1400" height="720" rx="34" fill="url(#bg)"/><text x="700" y="82" text-anchor="middle" fill="#fff" font-family="Arial" font-size="38" font-weight="700">THE CHANNEL IMPROVEMENT LOOP</text><text x="700" y="124" text-anchor="middle" fill="#a9c8e8" font-family="Arial" font-size="21">Use evidence to improve the viewer experience — not to chase vanity metrics</text><g font-family="Arial" text-anchor="middle"><g fill="url(#card)" stroke="#4b9bd4" stroke-width="2"><rect x="90" y="220" width="330" height="130" rx="22"/><rect x="535" y="220" width="330" height="130" rx="22"/><rect x="980" y="220" width="330" height="130" rx="22"/><rect x="980" y="460" width="330" height="130" rx="22"/><rect x="535" y="460" width="330" height="130" rx="22"/><rect x="90" y="460" width="330" height="130" rx="22"/></g><g fill="#fff" font-size="27" font-weight="700"><text x="255" y="275">1 · PUBLISH</text><text x="700" y="275">2 · OBSERVE</text><text x="1145" y="275">3 · DIAGNOSE</text><text x="1145" y="515">4 · HYPOTHESISE</text><text x="700" y="515">5 · TEST ONE CHANGE</text><text x="255" y="515">6 · RECORD LEARNING</text></g><g fill="#b9d7f4" font-size="18"><text x="255" y="310">Deliver the promised value</text><text x="700" y="310">Read metrics in context</text><text x="1145" y="310">Inspect the actual moment</text><text x="1145" y="550">State a reason and prediction</text><text x="700" y="550">Keep other factors stable</text><text x="255" y="550">Note limits and next action</text></g></g><g fill="none" stroke="#6ed8ff" stroke-width="6" marker-end="url(#arr)"><path d="M420 285H520"/><path d="M865 285H965"/><path d="M1145 350V450"/><path d="M980 525H875"/><path d="M535 525H430"/><path d="M255 460V360"/></g><text x="700" y="665" text-anchor="middle" fill="#e7f4ff" font-family="Arial" font-size="19">A metric is a clue. Inspect the content, test carefully, and document uncertainty.</text></svg>