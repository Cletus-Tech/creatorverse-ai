<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Responsible AI content creation workflow</title><desc id="d">Human-led workflow: define brief, select tool, prompt and generate, evaluate and verify, revise and approve, publish transparently.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#11102b"/><stop offset="1" stop-color="#26345e"/></linearGradient><linearGradient id="box" x2="1" y2="1"><stop stop-color="#31558b"/><stop offset="1" stop-color="#202c51"/></linearGradient><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#f3c879"/></marker></defs><rect width="1400" height="760" rx="32" fill="url(#bg)"/><text x="700" y="76" text-anchor="middle" fill="#fff" font-family="Arial" font-size="38" font-weight="700">HUMAN-LED AI CONTENT WORKFLOW</text><text x="700" y="116" text-anchor="middle" fill="#c4d2ef" font-family="Arial" font-size="21">AI assists creation. People provide direction, verification and accountability.</text><g font-family="Arial" text-anchor="middle"><g fill="url(#box)" stroke="#88b5e9" stroke-width="2"><rect x="70" y="190" width="360" height="150" rx="24"/><rect x="520" y="190" width="360" height="150" rx="24"/><rect x="970" y="190" width="360" height="150" rx="24"/><rect x="970" y="440" width="360" height="150" rx="24"/><rect x="520" y="440" width="360" height="150" rx="24"/><rect x="70" y="440" width="360" height="150" rx="24"/></g><g fill="#fff" font-size="27" font-weight="700"><text x="250" y="245">1 · DEFINE THE BRIEF</text><text x="700" y="245">2 · CHOOSE THE TOOL</text><text x="1150" y="245">3 · PROMPT &amp; GENERATE</text><text x="1150" y="495">4 · EVALUATE &amp; VERIFY</text><text x="700" y="495">5 · REVISE &amp; APPROVE</text><text x="250" y="495">6 · PUBLISH TRANSPARENTLY</text></g><g fill="#d7e4fb" font-size="18"><text x="250" y="285">Audience · goal · constraints</text><text x="700" y="285">Fit · privacy · rights · cost</text><text x="1150" y="285">Context · examples · format</text><text x="1150" y="535">Facts · bias · artifacts · rights</text><text x="700" y="535">Human judgement and QA</text><text x="250" y="535">Disclose when required</text></g></g><g fill="none" stroke="#f3c879" stroke-width="6" marker-end="url(#arrow)"><path d="M430 265H505"/><path d="M880 265H955"/><path d="M1150 350V430"/><path d="M970 515H895"/><path d="M520 515H445"/><path d="M250 440V350"/></g><rect x="400" y="635" width="600" height="70" rx="18" fill="#101d3b" stroke="#f3c879" stroke-width="2"/><text x="700" y="679" text-anchor="middle" fill="#ffe5ae" font-family="Arial" font-size="22" font-weight="700">Never upload secrets or publish unchecked output</text></svg>