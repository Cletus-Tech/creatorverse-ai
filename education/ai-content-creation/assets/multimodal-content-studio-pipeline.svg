<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="t d"><title id="t">Multimodal content production pipeline</title><desc id="d">One audience brief feeds text, image, audio and video production, followed by human review and coordinated campaign delivery.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091a32"/><stop offset="1" stop-color="#243a67"/></linearGradient><linearGradient id="tile" x2="1" y2="1"><stop stop-color="#225f83"/><stop offset="1" stop-color="#26345c"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#8be0d2"/></marker></defs><rect width="1400" height="760" rx="34" fill="url(#bg)"/><text x="700" y="76" fill="#fff" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700">MULTIMODAL CONTENT STUDIO</text><text x="700" y="118" fill="#c7d9ed" text-anchor="middle" font-family="Arial" font-size="21">One audience need → coordinated assets → human quality approval</text><g font-family="Arial" text-anchor="middle"><rect x="70" y="275" width="250" height="160" rx="22" fill="#1d4772" stroke="#8be0d2" stroke-width="3"/><text x="195" y="330" fill="#fff" font-size="26" font-weight="700">BRIEF + MESSAGE</text><text x="195" y="365" fill="#d7f6ef" font-size="20">Audience · goal · facts</text><text x="195" y="395" fill="#d7f6ef" font-size="20">Tone · constraints</text><g fill="url(#tile)" stroke="#8bb6e4" stroke-width="2"><rect x="420" y="180" width="220" height="105" rx="18"/><rect x="420" y="320" width="220" height="105" rx="18"/><rect x="420" y="460" width="220" height="105" rx="18"/><rect x="420" y="600" width="220" height="105" rx="18"/></g><g fill="#fff" font-size="25" font-weight="700"><text x="530" y="225">TEXT</text><text x="530" y="365">IMAGE</text><text x="530" y="505">AUDIO</text><text x="530" y="645">VIDEO</text></g><g fill="#d5e6fb" font-size="17"><text x="530" y="255">Scripts · captions</text><text x="530" y="395">Hero · graphics</text><text x="530" y="535">Voice · sound</text><text x="530" y="675">Clips · edits</text></g><rect x="760" y="275" width="260" height="160" rx="22" fill="#334c70" stroke="#f4d38b" stroke-width="3"/><text x="890" y="330" fill="#fff" font-size="26" font-weight="700">HUMAN REVIEW</text><text x="890" y="365" fill="#fff0cc" font-size="19">Facts · rights · quality</text><text x="890" y="395" fill="#fff0cc" font-size="19">Accessibility · brand</text><rect x="1130" y="275" width="220" height="160" rx="22" fill="#235c63" stroke="#8be0d2" stroke-width="3"/><text x="1240" y="330" fill="#fff" font-size="25" font-weight="700">CAMPAIGN</text><text x="1240" y="365" fill="#d7fff4" font-size="19">Coherent</text><text x="1240" y="395" fill="#d7fff4" font-size="19">adapted assets</text></g><g fill="none" stroke="#8be0d2" stroke-width="5" marker-end="url(#a)"><path d="M320 355H405"/><path d="M640 230C700 230 700 300 750 330"/><path d="M640 370H750"/><path d="M640 510C700 510 700 410 750 390"/><path d="M640 650C720 650 700 450 770 435"/><path d="M1020 355H1115"/></g><text x="700" y="730" text-anchor="middle" fill="#d8e8fb" font-family="Arial" font-size="18">Every output is checked against the original brief before it reaches the audience.</text></svg>