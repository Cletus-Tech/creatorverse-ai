<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
<title id="title">CreatorVerse crest</title><desc id="desc">A dimensional shield containing an open book, a rising creative path, a guiding star and connected points: learning that opens paths to creativity, opportunity and community.</desc>
<defs>
 <linearGradient id="shield" x1="28" y1="18" x2="226" y2="242" gradientUnits="userSpaceOnUse"><stop stop-color="#a9f5ff"/><stop offset=".25" stop-color="#438fff"/><stop offset=".68" stop-color="#304d9f"/><stop offset="1" stop-color="#151e4a"/></linearGradient>
 <linearGradient id="gold" x1="80" y1="70" x2="180" y2="180" gradientUnits="userSpaceOnUse"><stop stop-color="#fff3b0"/><stop offset=".45" stop-color="#f3c66b"/><stop offset="1" stop-color="#b87531"/></linearGradient>
 <linearGradient id="page" x1="72" y1="120" x2="184" y2="185" gradientUnits="userSpaceOnUse"><stop stop-color="#f7fdff"/><stop offset="1" stop-color="#8ecbff"/></linearGradient>
 <radialGradient id="shine" cx="0" cy="0" r="1" gradientTransform="matrix(120 130 -120 110 76 30)" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity=".46"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-30%" y="-25%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="7"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
