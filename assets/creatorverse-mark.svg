<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
<title id="title">CreatorVerse 3D emblem</title><desc id="desc">A dimensional blue C with a burgundy play symbol, metallic orbital ribbon and graduation cap.</desc>
<defs>
 <linearGradient id="blue" x1="75" y1="75" x2="420" y2="430" gradientUnits="userSpaceOnUse"><stop stop-color="#E8FCFF"/><stop offset=".12" stop-color="#58CFFF"/><stop offset=".32" stop-color="#1677F2"/><stop offset=".62" stop-color="#16449F"/><stop offset=".86" stop-color="#09265E"/><stop offset="1" stop-color="#06142F"/></linearGradient>
 <linearGradient id="blueSide" x1="90" y1="80" x2="410" y2="450" gradientUnits="userSpaceOnUse"><stop stop-color="#75DFFF"/><stop offset=".3" stop-color="#123B91"/><stop offset=".7" stop-color="#061735"/><stop offset="1" stop-color="#020817"/></linearGradient>
 <linearGradient id="red" x1="120" y1="150" x2="350" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#FF8AA5"/><stop offset=".2" stop-color="#E40046"/><stop offset=".55" stop-color="#9D0039"/><stop offset="1" stop-color="#36051F"/></linearGradient>
 <linearGradient id="silver" x1="80" y1="280" x2="450" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFFFF"/><stop offset=".18" stop-color="#8DEBFF"/><stop offset=".4" stop-color="#E9F8FF"/><stop offset=".68" stop-color="#6E9BCB"/><stop offset=".86" stop-color="#FFFFFF"/><stop offset="1" stop-color="#5478A8"/></linearGradient>
 <linearGradient id="gold" x1="360" y1="20" x2="440" y2="160" gradientUnits="userSpaceOnUse"><stop stop-color="#FFF5B2"/><stop offset=".35" stop-color="#FFC43D"/><stop offset=".7" stop-color="#C87913"/><stop offset="1" stop-color="#FFF0A0"/></linearGradient>
 <linearGradient id="cap" x1="150" y1="20" x2="380" y2="125" gradientUnits="userSpaceOnUse"><stop stop-color="#DDFBFF"/><stop offset=".18" stop-color="#3D9EFF"/><stop offset=".5" stop-color="#123F91"/><stop offset="1" stop-color="#06142F"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
