name: creatorverse_mobile
description: CreatorVerse native mobile application for Android and iOS.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: 2.2.0
  supabase_flutter: 2.18.3
  shared_preferences: ^2.5.3
  url_launcher: 6.3.2
  image_picker: 1.1.2
  video_player: 2.10.0
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_inappwebview: 6.1.5
  permission_handler: 12.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  flutter_launcher_icons: 0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/creatorverse-brand.svg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/creatorverse-icon.png
  adaptive_icon_background: "#06130C"
  adaptive_icon_foreground: assets/creatorverse-icon.png
  min_sdk_android: 21
