name: CreatorVerse Android APK — ARM64

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/lib/**'
      - 'apps/mobile/assets/**'
      - 'apps/mobile/firebase/**'
      - 'apps/mobile/pubspec.yaml'
      - 'apps/mobile/pubspec.lock'
      - '.github/workflows/android-apk-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creatorverse-arm64-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Generate Android platform
        working-directory: apps/mobile
        run: flutter create --platforms=android --org com.cletustech --project-name creatorverse_mobile .

      - name: Install Firebase Android configuration
        working-directory: apps/mobile
        run: |
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          import os
          settings = Path('android/settings.gradle.kts')
          source = settings.read_text()
          # The app's plugin management must resolve Kotlin plugin transitives from Maven Central.
          plugin_start = source.find('pluginManagement {')
          if plugin_start < 0:
              source = 'pluginManagement {' + chr(10) + '    repositories {' + chr(10) + '        google()' + chr(10) + '        mavenCentral()' + chr(10) + '        gradlePluginPortal()' + chr(10) + '    }' + chr(10) + '}' + chr(10) + source
          else:
              repositories_start = source.find('repositories {', plugin_start)
              if repositories_start < 0:
                  raise SystemExit('Could not find pluginManagement repositories in settings.gradle.kts')
              repositories_end = source.find('}', repositories_start)
              if repositories_end < 0:
                  raise SystemExit('Could not close pluginManagement repositories in settings.gradle.kts')
              repository_block = source[repositories_start:repositories_end]
              missing_repositories = [repository for repository in ('google()', 'mavenCentral()', 'gradlePluginPortal()') if repository not in repository_block]
              if missing_repositories:
                  addition = ''.join('        ' + repository + chr(10) for repository in missing_repositories)
                  source = source[:repositories_end] + addition + source[repositories_end:]
          settings.write_text(source)

          # Flutter's included Gradle build has its own plugin repositories. Patch those too.
          flutter_gradle_settings = Path(os.environ['FLUTTER_ROOT']) / 'packages/flutter_tools/gradle/settings.gradle.kts'
          flutter_source = flutter_gradle_settings.read_text()
          if 'pluginManagement {' not in flutter_source:
              flutter_plugin_management = (
                  'pluginManagement {' + chr(10)
                  + '    repositories {' + chr(10)
                  + '        google()' + chr(10)
                  + '        mavenCentral()' + chr(10)
                  + '        gradlePluginPortal()' + chr(10)
                  + '    }' + chr(10)
                  + '}' + chr(10)
              )
              flutter_source = flutter_plugin_management + flutter_source
          flutter_gradle_settings.write_text(flutter_source)
          kotlin_marker = 'id("org.jetbrains.kotlin.android")'
          if kotlin_marker not in source:
              raise SystemExit('Could not find Kotlin plugin declaration in settings.gradle.kts')
          if 'id("org.jetbrains.kotlin.android") version' not in source:
              source = source.replace(kotlin_marker, 'id("org.jetbrains.kotlin.android") version "2.2.20" apply false', 1)
          google_plugin = 'id("com.google.gms.google-services")'
          google_versioned = 'id("com.google.gms.google-services") version "4.6.0" apply false'
          if google_versioned not in source:
              if google_plugin in source:
                  source = source.replace(google_plugin, google_versioned, 1)
              else:
                  at = source.find('plugins {')
                  if at < 0:
                      raise SystemExit('Could not find plugins block in settings.gradle.kts')
                  at += len('plugins {')
                  source = source[:at] + '\n    ' + google_versioned + source[at:]
          settings.write_text(source)
          app_gradle = Path('android/app/build.gradle.kts')
          app_source = app_gradle.read_text()
          if google_plugin not in app_source:
              marker = 'id("dev.flutter.flutter-gradle-plugin")'
              if marker not in app_source:
                  raise SystemExit('Could not find Flutter Gradle plugin in app/build.gradle.kts')
              app_source = app_source.replace(marker, marker + '\n    ' + google_plugin, 1)
              app_gradle.write_text(app_source)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          if permission not in source:
              source = source.replace('<application', permission + '\n    <application', 1)
          metadata = '<meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="creatorverse_alerts" />'
          if 'com.google.firebase.messaging.default_notification_channel_id' not in source:
              source = source.replace('</application>', '        ' + metadata + '\n    </application>', 1)
          manifest.write_text(source)
          PY

      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Restore CreatorVerse launcher icon and native call tones
        working-directory: apps/mobile
        run: |
          python3 -m pip install --quiet --break-system-packages cairosvg
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url='assets/creatorverse-brand.svg',
              write_to='assets/creatorverse-icon.png',
              output_width=1024,
              output_height=1024,
          )
          PY
          dart run flutter_launcher_icons

          mkdir -p android/app/src/main/kotlin/com/cletustech/creatorverse_mobile
          cat > android/app/src/main/kotlin/com/cletustech/creatorverse_mobile/MainActivity.kt <<'KOTLIN'
          package com.cletustech.creatorverse_mobile

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.media.AudioAttributes
          import android.media.AudioManager
          import android.media.Ringtone
          import android.media.RingtoneManager
          import android.media.ToneGenerator
          import android.os.Build
          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val channelName = "creatorverse/call_ringtone"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val manager = getSystemService(NotificationManager::class.java)
                      if (manager.getNotificationChannel("creatorverse_alerts") == null) {
                          val alertSound = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                          val alertAudio = AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build()
                          val alerts = NotificationChannel(
                              "creatorverse_alerts",
                              "CreatorVerse notifications",
                              NotificationManager.IMPORTANCE_DEFAULT
                          ).apply {
                              description = "Messages, updates and activity from CreatorVerse"
                              enableVibration(true)
                              setSound(alertSound, alertAudio)
                          }
                          manager.createNotificationChannel(alerts)
                      }
                      if (manager.getNotificationChannel("creatorverse_calls_v2") == null) {
                          val ringtoneUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                          val ringtoneAudio = AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build()
                          val calls = NotificationChannel(
                              "creatorverse_calls_v2",
                              "Incoming calls",
                              NotificationManager.IMPORTANCE_HIGH
                          ).apply {
                              description = "Incoming CreatorVerse audio and video calls"
                              enableVibration(true)
                              lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                              setSound(ringtoneUri, ringtoneAudio)
                          }
                          manager.createNotificationChannel(calls)
                      }
                  }
              }
              private var incomingRingtone: Ringtone? = null
              private var fallbackTone: ToneGenerator? = null
              private var outgoingRingback: ToneGenerator? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, channelName)
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "start" -> {
                                  stopOutgoingRingback()
                                  startIncomingRingtone()
                                  result.success(null)
                              }
                              "stop" -> {
                                  stopIncomingRingtone()
                                  result.success(null)
                              }
                              "start_outgoing" -> {
                                  stopIncomingRingtone()
                                  startOutgoingRingback()
                                  result.success(null)
                              }
                              "stop_outgoing" -> {
                                  stopOutgoingRingback()
                                  result.success(null)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              private fun startIncomingRingtone() {
                  if (incomingRingtone?.isPlaying == true) return
                  try {
                      val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                      val ringtone = RingtoneManager.getRingtone(applicationContext, uri)
                      if (ringtone != null) {
                          ringtone.streamType = AudioManager.STREAM_RING
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) ringtone.isLooping = true
                          incomingRingtone = ringtone
                          ringtone.play()
                      } else {
                          fallbackTone = ToneGenerator(AudioManager.STREAM_RING, 85).also {
                              it.startTone(ToneGenerator.TONE_SUP_RINGTONE, 60000)
                          }
                      }
                  } catch (_: Exception) {
                      fallbackTone = ToneGenerator(AudioManager.STREAM_RING, 85).also {
                          it.startTone(ToneGenerator.TONE_SUP_RINGTONE, 60000)
                      }
                  }
              }

              private fun stopIncomingRingtone() {
                  try { incomingRingtone?.stop() } catch (_: Exception) {}
                  incomingRingtone = null
                  try { fallbackTone?.stopTone(); fallbackTone?.release() } catch (_: Exception) {}
                  fallbackTone = null
              }

              private fun startOutgoingRingback() {
                  if (outgoingRingback != null) return
                  outgoingRingback = ToneGenerator(AudioManager.STREAM_RING, 85).also {
                      it.startTone(ToneGenerator.TONE_SUP_RINGTONE, 60000)
                  }
              }

              private fun stopOutgoingRingback() {
                  try { outgoingRingback?.stopTone(); outgoingRingback?.release() } catch (_: Exception) {}
                  outgoingRingback = null
              }

              override fun onDestroy() {
                  stopIncomingRingtone()
                  stopOutgoingRingback()
                  super.onDestroy()
              }
          }
          KOTLIN

      - name: Patch Android WebView ProGuard compatibility
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          matches = list(Path.home().joinpath('.pub-cache/hosted/pub.dev').glob('flutter_inappwebview_android-*/android/build.gradle'))
          if not matches:
              raise SystemExit('flutter_inappwebview_android Gradle file was not found in the pub cache')
          for gradle in matches:
              source = gradle.read_text()
              old = "getDefaultProguardFile('proguard-android.txt')"
              new = "getDefaultProguardFile('proguard-android-optimize.txt')"
              if old in source:
                  gradle.write_text(source.replace(old, new))
                  print(f'Patched {gradle}')
              elif new in source:
                  print(f'Already compatible: {gradle}')
              else:
                  raise SystemExit(f'Expected ProGuard configuration not found in {gradle}')
          PY

      - name: Analyze Flutter code
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: apps/mobile
        run: flutter test

      - name: Build one ARM64 APK
        working-directory: apps/mobile
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: creatorverse-android-arm64
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
