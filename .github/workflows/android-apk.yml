name: CreatorVerse Android — Shorebird OTA and Releases
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose an OTA patch or a new full Android release"
        required: true
        type: choice
        options:
          - patch
          - release
        default: patch
      release_version:
        description: "Optional exact Shorebird release version for a patch (normally leave blank)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'apps/mobile/lib/**/*.dart'
permissions:
  contents: read
concurrency:
  group: creatorverse-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-android:
    if: github.event_name == 'workflow_dispatch' || vars.SHOREBIRD_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify Shorebird setup
        working-directory: apps/mobile
        run: |
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "::error::Add the SHOREBIRD_TOKEN repository secret before running Shorebird."
            exit 1
          fi
          if [ ! -f shorebird.yaml ]; then
            echo "::error::Run 'shorebird init' in apps/mobile and commit shorebird.yaml first."
            exit 1
          fi
      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Generate Android platform
        working-directory: apps/mobile
        run: flutter create --platforms=android --org com.cletustech --project-name creatorverse_mobile .
      - name: Install Firebase Android configuration
        working-directory: apps/mobile
        run: |
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          settings = Path('android/settings.gradle.kts')
          source = settings.read_text()
          kotlin_marker = 'id("org.jetbrains.kotlin.android")'
          if kotlin_marker not in source:
              raise SystemExit('Could not find Kotlin plugin declaration in settings.gradle.kts')
          if 'id("org.jetbrains.kotlin.android") version' not in source:
              source = source.replace(kotlin_marker, 'id("org.jetbrains.kotlin.android") version "2.2.20" apply false', 1)
          google_plugin = 'id("com.google.gms.google-services")'
          google_plugin_versioned = 'id("com.google.gms.google-services") version "4.6.0" apply false'
          if google_plugin_versioned not in source:
              if google_plugin in source:
                  source = source.replace(google_plugin, google_plugin_versioned, 1)
              else:
                  plugins_block = source.find('plugins {')
                  if plugins_block < 0:
                      raise SystemExit('Could not find plugins block in settings.gradle.kts')
                  insert_at = plugins_block + len('plugins {')
                  source = source[:insert_at] + '\n    ' + google_plugin_versioned + source[insert_at:]
          settings.write_text(source)
          app_gradle = Path('android/app/build.gradle.kts')
          app_source = app_gradle.read_text()
          if google_plugin not in app_source:
              marker = 'id("dev.flutter.flutter-gradle-plugin")'
              if marker not in app_source:
                  raise SystemExit('Could not find Flutter Gradle plugin in app/build.gradle.kts')
              app_source = app_source.replace(marker, marker + '\n    ' + google_plugin, 1)
              app_gradle.write_text(app_source)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          if permission not in source:
              source = source.replace('<application', permission + '\\n    <application', 1)
              manifest.write_text(source)
          PY
      - name: Configure CreatorVerse notification channel with sound
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          metadata = '<meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="creatorverse_alerts" />'
          if 'com.google.firebase.messaging.default_notification_channel_id' not in source:
              source = source.replace('</application>', '        ' + metadata + '\n    </application>', 1)
          manifest.write_text(source)
          package_dir = Path('android/app/src/main/kotlin/com/cletustech/creatorverse_mobile')
          package_dir.mkdir(parents=True, exist_ok=True)
          main_activity = package_dir / 'MainActivity.kt'
          main_activity.write_text("""package com.cletustech.creatorverse_mobile
          
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.ContentValues
          import android.net.Uri
          import android.provider.MediaStore
          import java.net.URL
          import android.media.AudioAttributes
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.media.RingtoneManager
          import android.media.ToneGenerator
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          
          class MainActivity : FlutterActivity() {
              private var incomingCallPlayer: MediaPlayer? = null
              private var outgoingCallTone: ToneGenerator? = null
              private val outgoingToneHandler = Handler(Looper.getMainLooper())
              private val outgoingToneRunnable = object : Runnable {
                  override fun run() {
                      val tone = outgoingCallTone ?: return
                      tone.startTone(ToneGenerator.TONE_SUP_RINGTONE, 4000)
                      outgoingToneHandler.postDelayed(this, 6000)
                  }
              }
              private var callAudioFocusRequest: android.media.AudioFocusRequest? = null
              private val callAudioFocusListener = AudioManager.OnAudioFocusChangeListener { }
          
              private fun startOutgoingCallTone() {
                  if (outgoingCallTone != null) return
                  outgoingCallTone = ToneGenerator(AudioManager.STREAM_VOICE_CALL, 75)
                  outgoingToneHandler.post(outgoingToneRunnable)
              }

              private fun stopOutgoingCallTone() {
                  outgoingToneHandler.removeCallbacks(outgoingToneRunnable)
                  outgoingCallTone?.stopTone()
                  outgoingCallTone?.release()
                  outgoingCallTone = null
              }

              override fun onDestroy() {
                  stopOutgoingCallTone()
                  stopIncomingCallRingtone()
                  super.onDestroy()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val manager = getSystemService(NotificationManager::class.java)
          
                      if (manager.getNotificationChannel("creatorverse_alerts") == null) {
                          val alertSound = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                          val alertAudio = AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build()
                          val alerts = NotificationChannel(
                              "creatorverse_alerts",
                              "CreatorVerse notifications",
                              NotificationManager.IMPORTANCE_DEFAULT
                          ).apply {
                              description = "Messages, updates and activity from CreatorVerse"
                              enableVibration(true)
                              setSound(alertSound, alertAudio)
                          }
                          manager.createNotificationChannel(alerts)
                      }
          
                      if (manager.getNotificationChannel("creatorverse_calls_v2") == null) {
                          val ringtoneUri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                          val ringtoneAudio = AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build()
                          val calls = NotificationChannel(
                              "creatorverse_calls_v2",
                              "Incoming calls",
                              NotificationManager.IMPORTANCE_HIGH
                          ).apply {
                              description = "Incoming CreatorVerse audio and video calls"
                              enableVibration(true)
                              lockscreenVisibility = Notification.VISIBILITY_PUBLIC
                              setSound(ringtoneUri, ringtoneAudio)
                          }
                          manager.createNotificationChannel(calls)
                      }
                  }
              }
          
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      "creatorverse/call_ringtone"
                  ).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "start_outgoing" -> {
                              try {
                                  startOutgoingCallTone()
                                  result.success(null)
                              } catch (error: Exception) {
                                  stopOutgoingCallTone()
                                  result.error("OUTGOING_TONE_FAILED", error.message, null)
                              }
                          }
                          "stop_outgoing" -> {
                              stopOutgoingCallTone()
                              result.success(null)
                          }
                          "start" -> {
                              try {
                                  if (incomingCallPlayer?.isPlaying != true) {
                                      stopIncomingCallRingtone()
                                      val uri = RingtoneManager.getActualDefaultRingtoneUri(
                                          applicationContext, RingtoneManager.TYPE_RINGTONE
                                      ) ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_RINGTONE)
                                        ?: RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                                        ?: throw IllegalStateException("This phone has no configured ringtone.")
                                      val audioAttributes = android.media.AudioAttributes.Builder()
                                          .setUsage(android.media.AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                                          .setContentType(android.media.AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                          .build()
                                      val audioManager = getSystemService(AudioManager::class.java)
                                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                          val focusRequest = android.media.AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN_TRANSIENT)
                                              .setAudioAttributes(audioAttributes)
                                              .setOnAudioFocusChangeListener(callAudioFocusListener)
                                              .build()
                                          callAudioFocusRequest = focusRequest
                                          audioManager.requestAudioFocus(focusRequest)
                                      } else {
                                          @Suppress("DEPRECATION")
                                          audioManager.requestAudioFocus(callAudioFocusListener, AudioManager.STREAM_RING, AudioManager.AUDIOFOCUS_GAIN_TRANSIENT)
                                      }
                                      incomingCallPlayer = MediaPlayer().apply {
                                          setAudioAttributes(audioAttributes)
                                          setDataSource(applicationContext, uri)
                                          isLooping = true
                                          setVolume(1.0f, 1.0f)
                                          prepare()
                                          start()
                                      }
                                  }
                                  result.success(null)
                              } catch (error: Exception) {
                                  stopIncomingCallRingtone()
                                  result.error("RINGTONE_START_FAILED", error.message, null)
                              }
                          }
                          "stop" -> {
                              stopIncomingCallRingtone()
                              result.success(null)
                          }
                          else -> result.notImplemented()
                      }
                  }
                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      "creatorverse/media_saver"
                  ).setMethodCallHandler { call, result ->
                      if (call.method != "save") {
                          result.notImplemented()
                          return@setMethodCallHandler
                      }
                      val mediaUrl = call.argument<String>("url")
                      val mimeType = call.argument<String>("mime") ?: "image/jpeg"
                      val requestedName = call.argument<String>("name") ?: "creatorverse-media"
                      if (mediaUrl.isNullOrBlank() || (!mimeType.startsWith("image/") && !mimeType.startsWith("video/"))) {
                          result.error("INVALID_MEDIA", "A valid image or video URL is required.", null)
                          return@setMethodCallHandler
                      }
                      Thread {
                          var savedUri: Uri? = null
                          try {
                              val connection = URL(mediaUrl).openConnection().apply {
                                  connectTimeout = 15000
                                  readTimeout = 45000
                              }
                              val isVideo = mimeType.startsWith("video/")
                              val extension = when (mimeType.lowercase()) {
                                  "image/png" -> ".png"
                                  "image/webp" -> ".webp"
                                  "image/gif" -> ".gif"
                                  "video/webm" -> ".webm"
                                  "video/quicktime" -> ".mov"
                                  else -> if (isVideo) ".mp4" else ".jpg"
                              }
                              val cleanName = requestedName.replace(Regex("[^A-Za-z0-9._-]"), "-")
                                  .ifBlank { "creatorverse-media" }
                              val displayName = if (cleanName.contains(".")) cleanName else cleanName + extension
                              val collection = if (isVideo) {
                                  MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                              } else {
                                  MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                              }
                              val values = ContentValues().apply {
                                  put(MediaStore.MediaColumns.DISPLAY_NAME, displayName)
                                  put(MediaStore.MediaColumns.MIME_TYPE, mimeType)
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                      put(MediaStore.MediaColumns.RELATIVE_PATH,
                                          if (isVideo) "Movies/CreatorVerse" else "Pictures/CreatorVerse")
                                      put(MediaStore.MediaColumns.IS_PENDING, 1)
                                  }
                              }
                              savedUri = contentResolver.insert(collection, values)
                                  ?: throw IllegalStateException("Android could not create the media file.")
                              connection.getInputStream().use { input ->
                                  val output = contentResolver.openOutputStream(savedUri!!)
                                      ?: throw IllegalStateException("Android could not open the media file.")
                                  output.use { input.copyTo(it) }
                              }
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  val readyValues = ContentValues().apply {
                                      put(MediaStore.MediaColumns.IS_PENDING, 0)
                                  }
                                  contentResolver.update(savedUri!!, readyValues, null, null)
                              }
                              runOnUiThread { result.success(savedUri.toString()) }
                          } catch (error: Exception) {
                              savedUri?.let { try { contentResolver.delete(it, null, null) } catch (_: Exception) {} }
                              runOnUiThread {
                                  result.error("SAVE_MEDIA_FAILED", error.message ?: "Could not save media.", null)
                              }
                          }
                      }.start()
                  }
              }
          
              private fun stopIncomingCallRingtone() {
                  try { incomingCallPlayer?.stop() } catch (_: Exception) { }
                  try { incomingCallPlayer?.release() } catch (_: Exception) { }
                  incomingCallPlayer = null
                  val audioManager = getSystemService(AudioManager::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      callAudioFocusRequest?.let { audioManager.abandonAudioFocusRequest(it) }
                      callAudioFocusRequest = null
                  } else {
                      @Suppress("DEPRECATION")
                      audioManager.abandonAudioFocus(callAudioFocusListener)
                  }
              }

              override fun onDestroy() {
                  stopIncomingCallRingtone()
                  super.onDestroy()
              }
          }
          """)
          PY
      - name: Work around Android release lint detector crash
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/build.gradle.kts')
          if p.exists():
              s = p.read_text()
              s += """
          // Disable Android lintVital tasks in CI because the bundled lint detector crashes.
          // Flutter analyze and tests run separately before the release build.
          gradle.projectsEvaluated {
              allprojects {
                  tasks.configureEach {
                      if (name.startsWith("lintVital")) {
                          enabled = false
                      }
                  }
              }
          }
          """
              p.write_text(s)
          PY
      - name: Set app label
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          p.write_text(p.read_text().replace('android:label="creatorverse_mobile"', 'android:label="CreatorVerse"'))
          PY
      - name: Ensure Android internet and media permissions
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
          ]
          for permission in permissions:
              if permission not in s:
                  s = s.replace('<application', permission + '\n    <application', 1)
          p.write_text(s)
          result = p.read_text()
          for permission in permissions:
              if permission not in result:
                  raise SystemExit(f'Android permission was not added: {permission}')
          gradle = Path('android/app/build.gradle.kts')
          gradle_source = gradle.read_text()
          if 'minSdk = flutter.minSdkVersion' in gradle_source:
              gradle_source = gradle_source.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23', 1)
          if 'minSdk = 23' not in gradle_source:
              raise SystemExit('Could not set Android minSdk to 23 for the microphone recorder plugin')
          gradle.write_text(gradle_source)
          PY
      - name: Configure OAuth callback deep link
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          source = p.read_text()
          pattern = r'(<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*>)(.*?)(</activity>)'
          match = re.search(pattern, source, flags=re.S)
          if not match:
              raise SystemExit('MainActivity was not found; OAuth callback cannot be registered')
          activity = match.group(0)
          if 'android:host="login-callback"' not in activity or 'android:host="reset-callback"' not in activity:
              callback = ''
              if 'android:host="login-callback"' not in activity:
                  callback += '''
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="io.supabase.creatorverse" android:host="login-callback" />
                      </intent-filter>
                  '''
              if 'android:host="reset-callback"' not in activity:
                  callback += '''
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="io.supabase.creatorverse" android:host="reset-callback" />
                      </intent-filter>
                  '''
              activity = activity.replace('</activity>', callback + '\n    </activity>')
              source = source[:match.start()] + activity + source[match.end():]
              p.write_text(source)
          PY
      - name: Configure persistent Android release signing
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in GitHub Actions secrets before creating the first Shorebird release."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/creatorverse-upload.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=creatorverse-upload.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle.kts')
          source = gradle.read_text()
          if 'import java.util.Properties' not in source:
              source = 'import java.util.Properties\n\n' + source
          if 'val keystoreProperties = Properties()' not in source:
              marker = 'android {'
              if marker not in source:
                  raise SystemExit('Could not find android block in app/build.gradle.kts')
              setup = '''val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          keystoreProperties.load(keystorePropertiesFile.inputStream())

          '''
              source = source.replace(marker, setup + marker, 1)
          if 'create("release")' not in source:
              marker = '    buildTypes {'
              if marker not in source:
                  raise SystemExit('Could not find buildTypes block in app/build.gradle.kts')
              signing = '''    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          '''
              source = source.replace(marker, signing + marker, 1)
          source = source.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")'
          )
          if 'signingConfig = signingConfigs.getByName("release")' not in source:
              raise SystemExit('Release signing configuration was not applied')
          gradle.write_text(source)
          PY
      - name: Install packages
        working-directory: apps/mobile
        run: flutter pub get
      - name: Patch Android webview plugin ProGuard configuration
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          plugin_dirs = list((Path.home() / '.pub-cache/hosted/pub.dev').glob('flutter_inappwebview_android-*/android'))
          if not plugin_dirs:
              raise SystemExit('flutter_inappwebview_android Gradle file was not found in the pub cache')
          for plugin_dir in plugin_dirs:
              gradle_file = plugin_dir / 'build.gradle'
              source = gradle_file.read_text()
              updated = source.replace("'proguard-android.txt'", "'proguard-android-optimize.txt'")
              updated = updated.replace('"proguard-android.txt"', '"proguard-android-optimize.txt"')
              if updated == source and 'proguard-android-optimize.txt' not in source:
                  raise SystemExit(f'Unexpected ProGuard configuration in {gradle_file}')
              if updated != source:
                  gradle_file.write_text(updated)
          PY
      - name: Generate original CreatorVerse launcher icon
        working-directory: apps/mobile
        run: |
          python3 -m pip install --quiet cairosvg
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url='assets/creatorverse-brand.svg',
              write_to='assets/creatorverse-icon.png',
              output_width=1024,
              output_height=1024,
          )
          PY
          dart run flutter_launcher_icons
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Test
        working-directory: apps/mobile
        run: flutter test
      - name: Read app release version
        id: app_version
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('pubspec.yaml').read_text()
          version_line = next((line for line in source.splitlines() if line.startswith('version:')), None)
          if version_line is None:
              raise SystemExit('Could not read version from pubspec.yaml')
          version = version_line.split(':', 1)[1].strip().strip("'").strip('"')
          with open(__import__('os').environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + chr(10))
          print(f'CreatorVerse release version: {version}')
          PY
      - name: Publish Shorebird OTA patch
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'patch')
        uses: shorebirdtech/shorebird-patch@v1
        with:
          platform: android
          release-version: ${{ inputs.release_version || steps.app_version.outputs.version }}
          track: stable
          working-directory: apps/mobile
          args: '--dart-define=SUPABASE_URL=https://xgdngnekihhnkzurhvpe.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_RS7zMUhSXPJGooi8lQmMIQ_NyS4pS-h'
      - name: Create Shorebird Android release
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'release'
        uses: shorebirdtech/shorebird-release@v1
        with:
          flutter-version: '3.47.9'
          platform: android
          working-directory: apps/mobile
          args: '--artifact=apk --dart-define=SUPABASE_URL=https://xgdngnekihhnkzurhvpe.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_RS7zMUhSXPJGooi8lQmMIQ_NyS4pS-h'
      - name: Upload Shorebird-enabled APK (first install or native release)
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: creatorverse-android-shorebird-release
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
