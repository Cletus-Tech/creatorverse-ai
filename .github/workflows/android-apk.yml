name: Build CreatorVerse Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/android-apk.yml']
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        working-directory: apps/mobile
        run: flutter create --platforms=android --org com.cletustech --project-name creatorverse_mobile .
      - name: Work around Android release lint detector crash
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/build.gradle.kts')
          if p.exists():
              s = p.read_text()
              s += '\n// Disable the broken lintVital task in this CI environment; Flutter analysis and tests run above.\nsubprojects { tasks.configureEach { if (name.startsWith("lintVital")) enabled = false } }\n'
              p.write_text(s)
          PY
      - name: Set app label
        working-directory: apps/mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          p.write_text(p.read_text().replace('android:label="creatorverse_mobile"', 'android:label="CreatorVerse"'))
          PY
      - name: Install packages
        working-directory: apps/mobile
        run: flutter pub get
      - name: Generate original CreatorVerse launcher icon
        working-directory: apps/mobile
        run: |
          python3 -m pip install --quiet cairosvg
          python3 - <<'PY'
          import cairosvg
          cairosvg.svg2png(
              url='assets/creatorverse-brand.svg',
              write_to='assets/creatorverse-icon.png',
              output_width=1024,
              output_height=1024,
          )
          PY
          dart run flutter_launcher_icons
      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze
      - name: Test
        working-directory: apps/mobile
        run: flutter test
      - name: Build release APK
        working-directory: apps/mobile
        run: flutter build apk --release --split-per-abi --dart-define=SUPABASE_URL=https://xgdngnekihhnkzurhvpe.supabase.co
      - uses: actions/upload-artifact@v4
        with:
          name: creatorverse-android-release
          path: apps/mobile/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 14
