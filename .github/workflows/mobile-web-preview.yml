name: CreatorVerse Flutter Web App Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'vercel-build.sh'
      - '.github/workflows/mobile-web-preview.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: creatorverse-mobile-web-preview
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out CreatorVerse
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Generate Flutter web platform files
        working-directory: apps/mobile
        run: flutter create --platforms=web --org com.cletustech --project-name creatorverse_mobile .

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze mobile app
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: apps/mobile
        run: flutter test

      - name: Build combined website and direct Flutter app preview
        run: bash ./vercel-build.sh

      - name: Upload combined preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: creatorverse-combined-web-preview
          path: dist
          if-no-files-found: error
          retention-days: 7
