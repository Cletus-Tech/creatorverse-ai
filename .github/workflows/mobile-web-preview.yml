name: CreatorVerse Flutter App Preview

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'vercel-build.sh'
      - '.github/workflows/mobile-web-preview.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: creatorverse-mobile-web-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out CreatorVerse
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Generate Flutter web platform files
        working-directory: apps/mobile
        run: flutter create --platforms=web --org com.cletustech --project-name creatorverse_mobile .

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze mobile app
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: apps/mobile
        run: flutter test

      - name: Build website and Flutter app at /app/
        env:
          APP_BASE_HREF: /creatorverse-ai/app/
        run: bash ./vercel-build.sh

      - name: Publish generated Flutter app files to main
        run: |
          rm -rf app
          mkdir -p app
          cp -a dist/app/. app/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "Flutter app preview is already up to date."
          else
            git commit -m "Publish Flutter app preview"
            git push
          fi

      - name: Upload combined website and app to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy combined website and app preview
        id: deployment
        uses: actions/deploy-pages@v4
