name: CreatorVerse Flutter App Preview

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'vercel-build.sh'
      - '.github/workflows/mobile-web-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: creatorverse-mobile-web-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out CreatorVerse
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - name: Generate Flutter web platform files
        working-directory: apps/mobile
        run: flutter create --platforms=web --org com.cletustech --project-name creatorverse_mobile .

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze mobile app
        working-directory: apps/mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: apps/mobile
        run: flutter test

      - name: Build website and Flutter app at /app/
        env:
          APP_BASE_HREF: /creatorverse-ai/app/
        run: bash ./vercel-build.sh

      - name: Publish generated Flutter app files to main (retry safe push)
        run: |
          APP_BUILD_DIR="$(mktemp -d)"
          cp -a dist/app/. "$APP_BUILD_DIR"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Retry if another workflow updates main between fetch and push.
          for attempt in 1 2 3; do
            echo "Publishing app preview (attempt ${attempt}/3)"
            git fetch origin main
            git reset --hard origin/main
            rm -rf app
            mkdir -p app
            cp -a "$APP_BUILD_DIR"/. app/
            git add app

            if git diff --cached --quiet; then
              echo "Flutter app preview is already up to date."
              rm -rf "$APP_BUILD_DIR"
              exit 0
            fi

            git commit -m "Publish Flutter app preview"
            if git push origin HEAD:main; then
              echo "Flutter app preview published successfully."
              rm -rf "$APP_BUILD_DIR"
              exit 0
            fi
            echo "main changed during publication; retrying."
          done

          rm -rf "$APP_BUILD_DIR"
          echo "Could not publish app preview after 3 attempts."
          exit 1
